# HVAC 明文 PID 闭环基线；完整保留场景参数以保证单个配置文件可独立复现。
scenario:
  name: hvac
  hvac:
    timing:
      sampling_period_seconds: 60
      horizon_seconds: 10800
      sample_count: 180
      terminal_sample_included: false
      update_order: measure_adapt_control_plant_record
      output_log_time_index: pre_plant_step

    model:
      kind: first_order_rc_cooling
      discretization: zero_order_hold
      thermal_resistance_celsius_per_kw: 2.0
      thermal_capacitance_kj_per_celsius: 1200.0
      cooling_coefficient: 1.0
      ambient_temperature_celsius: 30.0
      initial_temperature_celsius: 30.0
      control:
        unit: kW_thermal_cooling
        positive_direction: cooling
        lower_bound_kw: 0.0
        upper_bound_kw: 12.0

    reference:
      unit: degC
      endpoint_value_celsius: 25.0
      segments:
        - start_seconds: 0
          end_seconds: 3600
          target_temperature_celsius: 15.0
        - start_seconds: 3600
          end_seconds: 7200
          target_temperature_celsius: 20.0
        - start_seconds: 7200
          end_seconds: 10800
          target_temperature_celsius: 25.0

    signal_adapter:
      kind: reference_minus_temperature
      output_unit: degC
      controller_input_unit: degC

    channels:
      reference:
        names: [target_temperature]
        units: [degC]
      output:
        names: [temperature]
        units: [degC]
      control:
        names: [cooling_power]
        units: [kW_thermal_cooling]

    controller:
      kind: positional_pid_error_derivative
      proportional_gain_kw_per_celsius: -0.8
      integral_gain_kw_per_celsius_second: -0.0005
      derivative_gain_kw_second_per_celsius: -2.0
      initial_integral_error_celsius_seconds: 0.0
      initial_previous_error_celsius: 0.0
      derivative_filter: none
      anti_windup: disabled
      output_saturation: scenario_before_plant

    tracking:
      tail_window_seconds: 600
      max_tail_mae_celsius: 1.0
