# 部署模板：将 host 改为可达 DNS/IP；身份名与网络地址分离。不要提交现场地址或私钥。
version: 1
identities:
  Client: client.secure-control.test
  P1: p1.secure-control.test
  P2: p2.secure-control.test
p1_client:
  bind: 0.0.0.0
  host: p1.example.test
  port: 34401
p2_client:
  bind: 0.0.0.0
  host: p2.example.test
  port: 34402
p1_peer:
  bind: 0.0.0.0
  host: p1.example.test
  port: 34403
