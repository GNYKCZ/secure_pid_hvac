# 一台电脑、三条不同固定端口；保持与真实 LAN 完全相同的连接方向和 TLS。
version: 1
identities:
  Client: client.secure-control.test
  P1: p1.secure-control.test
  P2: p2.secure-control.test
p1_client:
  bind: 127.0.0.1
  host: 127.0.0.1
  port: 34401
p2_client:
  bind: 127.0.0.1
  host: 127.0.0.1
  port: 34402
p1_peer:
  bind: 127.0.0.1
  host: 127.0.0.1
  port: 34403
