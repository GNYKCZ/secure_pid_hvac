# 三方共用的固定端口拓扑；本机用 127.0.0.1，跨机器时三份文件的内容须相同并填实际局域网 IP。
# 连接是否使用 TLS 由各角色配置决定，不由拓扑决定。
version: 1
identities:
  Client: client.secure-control.test
  P1: p1.secure-control.test
  P2: p2.secure-control.test
p1_client:
  bind: 127.0.0.1
  host: 127.0.0.1
  port: 34401
p2_client:
  bind: 127.0.0.1
  host: 127.0.0.1
  port: 34402
p1_peer:
  bind: 127.0.0.1
  host: 127.0.0.1
  port: 34403
